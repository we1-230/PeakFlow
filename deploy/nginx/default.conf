# ============================================================================
# PeakFlow 秒杀商城 · 宿主机 Nginx 站点配置（生产 / 整栈入口）
# ----------------------------------------------------------------------------
# 【与 frontend/nginx/default.conf 的区别】
#   · 本文件：给【宿主机上的 Nginx】用。upstream 指向宿主机 127.0.0.1 上的
#     两个后端实例（8080 / 8081）与前端静态目录，适合「服务器已装 Nginx，
#     只把构建产物放上去、后端以 java -jar 跑在宿主机上」的传统部署方式。
#   · frontend/nginx/default.conf：打进【前端容器】镜像，upstream 写 compose
#     的服务名（backend1:8080 / backend2:8080），由 docker-compose 直接使用。
#   两者职责相同、上游不同 —— 按部署方式二选一，不要同时挂在同一条链路上。
#
# 用法（宿主机 Nginx）：
#   sudo cp deploy/nginx/default.conf /etc/nginx/conf.d/peakflow.conf
#   sudo sed -i 's/peakflow.example.com/你的域名/' /etc/nginx/conf.d/peakflow.conf
#   sudo nginx -t && sudo systemctl reload nginx
# ============================================================================

upstream peakflow_backend {
    # 后端 Spring Boot 双实例（server.port=8080 / 8081，靠 SNOWFLAKE_WORKER_ID 区分）
    # least_conn：交给当前活跃连接最少的实例。秒杀下单是长耗时请求，
    # 轮询会把新请求继续压到正忙的那个，least_conn 能让两边连接数自动拉平
    least_conn;

    # 某实例连续失败 3 次即摘除 10s，避免把流量打到已挂掉的节点
    server 127.0.0.1:8080 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:8081 max_fails=3 fail_timeout=10s;

    keepalive 32;
    keepalive_timeout 60s;
    keepalive_requests 1000;
}

server {
    listen       80;
    server_name  peakflow.example.com;

    # 前端构建产物目录（frontend 下执行 npm run build 得到 dist/）
    root  /var/www/peakflow/dist;
    index index.html;

    charset utf-8;
    client_max_body_size 10m;   # 与后端 spring.servlet.multipart.max-file-size 对齐

    # ------------------------------------------------------------------
    # gzip：JS/CSS 收益最大
    # ------------------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_types        text/plain text/css application/json application/javascript
                      application/x-javascript text/xml application/xml
                      application/xml+rss image/svg+xml;

    # ------------------------------------------------------------------
    # 带 hash 的静态资源：长缓存
    # Vite 产物形如 assets/index-4f3a1c.js，内容变则文件名变，可放心 immutable
    # ------------------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ------------------------------------------------------------------
    # API 反向代理
    # 与 frontend/vite.config.js 的 dev proxy 保持同一套前缀重写规则：
    #   浏览器请求 /api/xxx  →  后端收到 /xxx
    # 这样前端代码里统一写 /api 前缀，dev 与生产行为一致，无需分环境改代码
    # ------------------------------------------------------------------
    location /api/ {
        proxy_pass         http://peakflow_backend/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # 秒杀接口在最坏情况下要等 MQ 降级同步落库，给足超时
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # ------------------------------------------------------------------
    # SPA history 路由回退
    # 必须在最后：/orders/123 这类前端路由在服务器上没有对应文件，
    # 返回 index.html 交给 Vue Router 处理，否则刷新页面直接 404
    # ------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 隐藏文件与工程文件不给外网
    location ~ /\.(?!well-known) {
        deny all;
    }

    # 健康检查（供负载均衡 / 监控探活，不写访问日志）
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
