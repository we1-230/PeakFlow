# ============================================================================
# PeakFlow 秒杀商城 · 生产站点配置（容器内 Nginx）
# ----------------------------------------------------------------------------
# 由 docker-compose.prod.yml 以 bind mount 覆盖镜像自带的
#   /etc/nginx/conf.d/default.conf：
#     ./deploy/nginx/peakflow-prod.conf : /etc/nginx/conf.d/default.conf : ro
#
# 【为什么要覆盖，而不是直接用镜像里那份（frontend/nginx/default.conf）】
#   1) 那份的 upstream 写死了 backend1 + backend2 两个实例。生产只跑单实例，
#      backend2 的容器根本不存在 ⇒ 容器名解析不了 ⇒ nginx 启动直接报
#      "host not found in upstream backend2:8080" 并无限重启。
#      （upstream 里的主机名是在 nginx【启动时】解析的，不是每次请求解析。）
#   2) 生产要加限流与安全响应头；这些放在开发机上只会干扰本地调试。
#   开发形态（不带生产覆盖文件）仍然用镜像里那份，行为一点不变。
#
# 【本文件的四部分，顺序不能乱】
#   ⓪ http 级：gzip 压缩（本文件所有 server 共用）
#   ① http 级：限流区声明（limit_req_zone 只允许写在 http 级）
#   ② upstream：后端上游（生产单实例）
#   ③ server：80 端口整站
# 站点"怎么托管前端产物、怎么反代 /api"的公共部分放在
#   snippets/peakflow-locations.inc，HTTP 与 HTTPS 共用同一份。
#
# 【bind mount 的好处】改这个文件不需要重新构建镜像，
#   在服务器上执行 docker compose ... up -d nginx 即可生效。
# ============================================================================

# ---------------------------------------------------------------------------
# ⓪ gzip 压缩（http 级，对本文件里的所有 server 生效）
#
# ★ 为什么生产必须有、而且比开发更关键：
#     前端主 JS 未压缩约 1.25MB。国内同城访问压缩与否差别不大，
#     但部署到海外节点（如美国弗吉尼亚，实测 RTT 328ms）时，
#     不压缩光传这个文件就要好几秒 —— gzip 后约 350KB，快 3~4 倍。
#     跨洋链路带宽往往只有几百 KB/s，省下 900KB 是实打实的体验差距。
#
# ⚠️ 几个容易漏的点：
#   · gzip_vary on 必须开：同一个 URL 会返回「压缩」与「未压缩」两种内容，
#     不加 Vary: Accept-Encoding 会让中间层代理/CDN 缓存串味（把压缩版发给
#     不支持 gzip 的客户端，页面直接乱码）。
#   · gzip_min_length 1000：响应太短时 gzip 的头开销反而让体积变大。
#   · gzip_types 必须显式列：nginx 默认【只压缩 text/html】，
#     不写这行的话 JS/CSS/JSON 全都不压 —— 而它们才是大头。
#   · 不要加图片/字体类（jpg/png/woff2 本身已压缩），白费 CPU。
# ---------------------------------------------------------------------------
gzip              on;
gzip_vary         on;
gzip_comp_level   6;
gzip_min_length   1000;
gzip_proxied      any;
gzip_disable      "msie6";
gzip_types        text/plain text/css text/xml text/javascript
                  application/json application/javascript application/xml
                  application/rss+xml image/svg+xml;

# ---------------------------------------------------------------------------
# ① 限流区
#   维度用 $binary_remote_addr（客户端 IP 的二进制形式，比 $remote_addr 省内存），
#   10m 大约能记录 16 万个 IP 的状态。zone 名字在同一个 nginx 实例内全局唯一。
# ---------------------------------------------------------------------------

# 登录 / 注册：1 req/s。这是防「撞库」的关键闸门 ——
#   连续试密码会被压到每秒 1 次，脚本爆破直接失去意义。
limit_req_zone $binary_remote_addr zone=pf_login:10m rate=1r/s;

# 秒杀下单：5 req/s。正常用户手点不可能超过，脚本高频刷单会被拦下。
limit_req_zone $binary_remote_addr zone=pf_order:10m rate=5r/s;

# 其余 /api：20 req/s，给页面正常加载留足余量。
limit_req_zone $binary_remote_addr zone=pf_api:10m   rate=20r/s;

# 单 IP 并发连接数上限
limit_conn_zone $binary_remote_addr zone=pf_conn:10m;

# 被限流时返回 429（nginx 默认是 503）。
#   429 Too Many Requests 语义准确，前端可以据此提示"操作太频繁"，
#   而不是误报成"服务不可用"。
limit_req_status  429;
limit_conn_status 429;

# ---------------------------------------------------------------------------
# ② 后端上游：生产只有 1 个实例
#   单实例下 least_conn 没有意义，去掉；保留 keepalive 复用长连接。
#   max_fails/fail_timeout 仍然保留 —— 将来要扩成多实例，
#   在这里加一行 server backend2:8080 ... 就行，其余无需改动。
# ---------------------------------------------------------------------------
upstream peakflow_backend {
    server backend1:8080 max_fails=3 fail_timeout=10s;

    keepalive 32;
    keepalive_timeout 60s;
    keepalive_requests 1000;
}

# ---------------------------------------------------------------------------
# ③ 80 端口整站
#   ⚠️ 这里【故意不写】default_server。
#      启用 HTTPS 后会再多一个 80 端口的 server（只做「301 跳 https」），
#      那个才需要 default_server。同一个 listen 端口只能有一个 default_server，
#      两边都写会报 "a duplicate default server for 0.0.0.0:80" 起不来。
# ---------------------------------------------------------------------------
server {
    listen      80;
    # 单个实体站点、不校验 Host：未备案期间用「IP:端口」直接访问也能打开
    server_name _;

    # 站点公共段：静态托管 + /api 反代 + 安全响应头 + ACME 挑战
    include /etc/nginx/snippets/peakflow-locations.inc;
}
