# ============================================================================
# RocketMQ Broker —— 本地开发专用配置
# ----------------------------------------------------------------------------
# 只在本地开发栈里用（由 docker-compose.dev-ports.yml 挂载进容器）。
# 生产用的主 compose 走镜像自带的默认 broker.conf，不读这个文件。
#
# 和默认配置的唯一实质区别就是 brokerIP1，下面解释为什么必须改。
# ============================================================================

brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0

# ---- 消息清理策略 ----
# 凌晨 4 点清理过期消息，保留 48 小时（本地够用了，不用囤）
deleteWhen = 04
fileReservedTime = 48

# ---- 刷盘与主从 ----
# ASYNC_MASTER / ASYNC_FLUSH：本地开发追求快，不做同步刷盘。
# 生产如果要保消息不丢，应该改成 SYNC_MASTER + SYNC_FLUSH（代价是吞吐下降）。
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH

# ---- 关键：注册给客户端的地址 ----
#
# Broker 启动时会向 NameServer 注册「客户端应该通过哪个地址连我」。
# 默认取的是容器网卡 IP（形如 172.18.0.5）。
#
# 你的后端跑在 IDEA 里 = 在宿主机上，宿主机是连不到容器的 172.x 内网 IP 的。
# 于是会出现非常典型的一幕：
#   · 启动不报错
#   · 第一次发消息卡住十几秒，然后抛
#     RemotingConnectException / sendDefaultImpl call timeout
#   · 到 NameServer 里查 topic 又都正常
#
# 把 brokerIP1 固定成 127.0.0.1，再配合 docker-compose.dev-ports.yml 里
# 把 10909/10911/10912 映射到宿主机，宿主机就真能连上了。
#
# 注意：这个值只对「后端在宿主机跑」成立。如果你改成全栈都在容器里跑
#      （用主 compose），这一行反而是错的，别照抄到生产配置里。
brokerIP1 = 127.0.0.1

# ---- 本地开发便利项 ----
# 自动创建 Topic / 订阅组：本地调试不用每次先进控制台建 topic。
# 生产必须关掉，否则打错 topic 名不会报错，只会静默生成一堆垃圾 topic。
autoCreateTopicEnable = true
autoCreateSubscriptionGroup = true

# ---- 队列数 ----
# 默认 4 个读队列 / 4 个写队列。本地单实例够用；
# 想在本机压测消费并行度可以调大，但要注意 broker 内存预算。
defaultTopicQueueNums = 4
