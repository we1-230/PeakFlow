# ============================================================================
# PeakFlow 秒杀商城 · RocketMQ Broker 配置
# ----------------------------------------------------------------------------
# 由 docker-compose.yml 挂载到容器内 /home/rocketmq/conf/broker.conf，
# 启动命令用 `-c /home/rocketmq/conf/broker.conf` 显式指定。
# ============================================================================

brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0

# ---------------------------------------------------------------------------
# namesrvAddr：broker 往哪个 NameServer 注册自己
#   容器内走 compose 的服务名（同一自定义网络内可解析），不能写 127.0.0.1 ——
#   容器里的 127.0.0.1 指容器自己，namesrv 在另一个容器，会连不上。
# ---------------------------------------------------------------------------
namesrvAddr = namesrv:9876

# ---------------------------------------------------------------------------
# brokerIP1：broker 注册到 NameServer 的【调用方可达地址】—— 本文件最关键的一项
#
# 它决定了「应用从 NameServer 拿到哪个地址去连 broker」，写错的表现是：
# 秒杀接口返回 200、订单也建出来了，但日志里全是
# `syncSend failed ... BrokersSent: [broker-a, broker-a, broker-a]`，
# 实际走的是降级同步落库 —— 看起来"能跑"，MQ 却完全没参与。
#
# 所以它的值必须取决于「谁在当调用方」：
#   · 后端跑在容器里（默认部署形态）→ broker  ← 同一自定义网络内的服务名
#   · 后端跑在宿主机（叠加 dev 覆盖文件）→ 127.0.0.1（10911 已 publish 到宿主机）
#
# ★ 这里写成占位符，由 compose 在启动时用 $BROKER_IP1 渲染出真正的配置
#   （见 docker-compose.yml 里 broker 服务的 command）。
#   直接用这个文件跑 `mqbroker -c` 是不行的 —— 它是个模板，不是最终配置。
#
# 部署到真实服务器时，把 BROKER_IP1 设成该机器对调用方可达的 IP / 域名即可。
# ---------------------------------------------------------------------------
brokerIP1 = __BROKER_IP1__

listenPort = 10911

# ---------------------------------------------------------------------------
# 开发便利项
# ---------------------------------------------------------------------------
# 允许自动创建 Topic：首次运行不必手工建 seckill_order_topic / order_timeout_topic
# 生产环境建议置 false，由运维显式建 Topic 并规划队列数
autoCreateTopicEnable = true
autoCreateSubscriptionGroup = true

# 默认队列数：秒杀消费者并发度设为 64（见 SeckillConsumer），
# 队列数低于并发度会有一半线程空闲，因此这里给足
defaultTopicQueueNums = 8

# ---------------------------------------------------------------------------
# 刷盘与主从
# ---------------------------------------------------------------------------
# 异步刷盘：牺牲一点可靠性换取吞吐，适合本地开发与演示
# 生产要求不丢消息时改成 SYNC_FLUSH
flushDiskType = ASYNC_FLUSH
brokerRole = ASYNC_MASTER

# 消息保留 72 小时（默认 72h，显式写出便于排查）
fileReservedTime = 72

# 禁止 Broker 自己消费一些内部消息时用的默认组，
# 避免与应用的消费者组（seckill_order_consumer_group 等）混淆
# （这行保持默认即可，留作占位说明）
# rejectTransactionMessage = false
