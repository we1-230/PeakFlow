# ============================================================================
# PeakFlow 秒杀商城 · RocketMQ Broker 配置
# ----------------------------------------------------------------------------
# 由 docker-compose.yml 挂载到容器内 /home/rocketmq/conf/broker.conf，
# 启动命令用 `-c /home/rocketmq/conf/broker.conf` 显式指定。
# ============================================================================

brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0

# ---------------------------------------------------------------------------
# namesrvAddr：broker 往哪个 NameServer 注册自己
#   容器内走 compose 的服务名（同一自定义网络内可解析），不能写 127.0.0.1 ——
#   容器里的 127.0.0.1 指容器自己，namesrv 在另一个容器，会连不上。
# ---------------------------------------------------------------------------
namesrvAddr = namesrv:9876

# ---------------------------------------------------------------------------
# brokerIP1：broker 注册到 NameServer 的【对外可达地址】—— 本文件最关键的一项
#
# 不配的话，broker 会把容器自己的内网 IP（如 172.20.0.3）注册上去。
# 宿主机的应用从 NameServer 拿到这个地址后去连 172.20.0.3:10911，
# 而宿主机并不在 Docker 网桥里 → 连接超时，
# 表现为「MQ 发送失败」进而触发秒杀降级同步落库，秒杀链路看起来"能跑但没走 MQ"。
#
# 本地开发：broker 的 10911 已 publish 到宿主机，所以填 127.0.0.1 即可被宿主机访问。
# 部署到服务器：改成服务器公网 / 内网 IP，或宿主机的 hostname。
# ---------------------------------------------------------------------------
brokerIP1 = 127.0.0.1

listenPort = 10911

# ---------------------------------------------------------------------------
# 开发便利项
# ---------------------------------------------------------------------------
# 允许自动创建 Topic：首次运行不必手工建 seckill_order_topic / order_timeout_topic
# 生产环境建议置 false，由运维显式建 Topic 并规划队列数
autoCreateTopicEnable = true
autoCreateSubscriptionGroup = true

# 默认队列数：秒杀消费者并发度设为 64（见 SeckillConsumer），
# 队列数低于并发度会有一半线程空闲，因此这里给足
defaultTopicQueueNums = 8

# ---------------------------------------------------------------------------
# 刷盘与主从
# ---------------------------------------------------------------------------
# 异步刷盘：牺牲一点可靠性换取吞吐，适合本地开发与演示
# 生产要求不丢消息时改成 SYNC_FLUSH
flushDiskType = ASYNC_FLUSH
brokerRole = ASYNC_MASTER

# 消息保留 72 小时（默认 72h，显式写出便于排查）
fileReservedTime = 72

# 禁止 Broker 自己消费一些内部消息时用的默认组，
# 避免与应用的消费者组（seckill_order_consumer_group 等）混淆
# （这行保持默认即可，留作占位说明）
# rejectTransactionMessage = false
