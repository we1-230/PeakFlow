# ============================================================================
# PeakFlow · 本地开发端口覆盖文件（可选）
# ----------------------------------------------------------------------------
# 为什么不叫 docker-compose.override.yml：
#   那个文件名会被 compose **自动加载**，导致默认的 `docker compose up -d`
#   就带上这些端口，阶段 9「只有 nginx 暴露 80」的部署形态就不成立了。
#   所以这里刻意取名 docker-compose.dev.yml —— 必须显式叠加才会生效。
#
# 用法：
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# 什么时候需要它：
#   ① 在 IDE 里直跑后端（要连 127.0.0.1:3307 / 6380 / 9876）
#   ② 在宿主机跑 postman 种子脚本（要连 3307）与 newman（要连 8080）
#   ③ 跑前端 dev server（vite 把 /api 代理到 127.0.0.1:8080）
#   ④ 单独 curl 某一个后端实例，确认它自己活着
#
# ⚠️ 这些端口**不参与**阶段 9/10/11 的验收，别在生产或验收时叠加本文件。
# ============================================================================

services:

  mysql:
    ports:
      # 宿主 ${DB_PORT} → 容器 3306；Spring 的 DB_PORT 复用同一个变量，单一事实来源
      - "${DB_PORT:-3307}:3306"

  redis:
    ports:
      - "${REDIS_PORT:-6380}:6379"

  namesrv:
    ports:
      - "${ROCKETMQ_NAMESRV_PORT:-9876}:9876"

  broker:
    environment:
      # ★ 关键：宿主机上的后端要连 broker，而它不在 Docker 网络里，
      #   解析不了服务名 broker。所以这里让 broker 改宣告 127.0.0.1，
      #   配合下面的端口发布，宿主机就能连上。
      #
      #   注意这意味着：叠加 dev 覆盖文件时，MQ 是「为宿主机后端」准备的。
      #   若此时仍用容器里的 backend1/backend2，它们会解析 127.0.0.1 指向自己 →
      #   连不上 broker → 秒杀降级同步落库。两种方式二选一，别混用。
      BROKER_IP1: "127.0.0.1"
    ports:
      - "${ROCKETMQ_BROKER_PORT:-10911}:10911"   # 主端口：客户端收发消息
      - "10909:10909"                            # VIP 通道（未启用，留给后续）
      - "10912:10912"                            # HA 主从同步（单机不用）

  backend1:
    ports:
      - "${BACKEND1_PORT:-8080}:8080"

  backend2:
    ports:
      - "${BACKEND2_PORT:-8081}:8080"
