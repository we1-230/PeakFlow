# ============================================================================
# PeakFlow · GitHub Actions CI
# ----------------------------------------------------------------------------
# 设计原则：CI 里的每一条命令都和本地验证过的方式完全一致，不发明新跑法。
#
# 后端：不用 actions/setup-java，而是直接复用项目自带的 tester 容器
#   （deploy/tester/Dockerfile：JDK17 + Maven + 预热好的本地仓库），
#   `docker compose exec tester mvn verify` 是 README / compose 注释里
#   本来就文档化、本地已跑绿的路径 —— 保证「本地绿 = CI 绿」同一套口径。
#
# 前端：只跑单元测试（vitest）。集成/回归测试需要整套 compose 栈 +
#   nginx 入口，属于部署级验证，放在本仓库的冒烟/发布流程里更合适，
#   避免为了一个 job 每次全栈构建拖慢主干反馈。
# ============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend · mvn verify（tester 容器内，204 用例）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # CI 没有 .env（被 .gitignore 排除），但两处强依赖它：
      #   1. compose 的 MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?...}（缺了直接报错）
      #   2. tester 的 env_file: .env
      # 因此从模板生成，并只覆盖 CI 需要的变量；密钥用「仅 CI」的一次性值，
      # 与 .env.example 的安全约定一致：绝不提交真实密钥。
      # ------------------------------------------------------------------
      - name: 生成 CI 专用 .env
        run: |
          cp .env.example .env
          sed -i \
            -e 's|^SPRING_PROFILES_ACTIVE=.*|SPRING_PROFILES_ACTIVE=test|' \
            -e 's|^DB_NAME=.*|DB_NAME=|' \
            -e 's|^DB_USERNAME=.*|DB_USERNAME=root|' \
            -e 's|^DB_PASSWORD=.*|DB_PASSWORD=peakflow-ci-2026|' \
            -e 's|^REDIS_DATABASE=.*|REDIS_DATABASE=|' \
            -e 's|^JWT_SECRET=.*|JWT_SECRET=ci-only-secret-0123456789abcdef0123456789abcdef|' \
            -e 's|^MOCK_PAY_SECRET=.*|MOCK_PAY_SECRET=peakflow-mock-pay-secret-key-2026|' \
            .env

      # depends_on 要求 mysql/redis/broker 三个 healthcheck 全绿才算就绪，
      # 这一步天然等价于本地的「等中间件起来再跑测试」
      - name: 启动中间件与 tester（等健康检查通过）
        run: docker compose --profile test up -d --build tester

      - name: 后端全量测试（mvn verify）
        run: docker compose exec -T tester mvn -B -ntp verify

      - name: 失败时导出中间件日志
        if: failure()
        run: docker compose logs --tail 200 mysql redis namesrv broker

  frontend:
    name: Frontend · 单元测试（vitest，92 用例）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖（按 lockfile 精确还原）
        run: npm ci

      - name: 单元测试
        run: npm test
