# ===================== 生产环境（prod）=====================
# 数据库：peakflow_prod（生产库）  Redis：同一实例独立逻辑库 db2
# 说明：本文件只做「差异化覆盖」——敏感项占位符、安全开关收紧、日志独立目录，
#      公共项（MyBatis-Plus / 业务参数 / 白名单等）仍由 application.yml 提供。
spring:
  # Redis：复用同一 Redis 实例，仅分配独立逻辑库（生产 db2），不新增中间件实例
  redis:
    host: ${REDIS_HOST:}
    port: ${REDIS_PORT:}
    database: ${REDIS_DATABASE:2}
    # 生产必须设置超时，防止 redis 故障阻塞业务线程
    timeout: 2000ms
    connect-timeout: 1000ms
    lettuce:
      pool:
        max-active: 100
        max-idle: 50
        min-idle: 20
        max-wait: 3000ms
      shutdown-timeout: 100ms

  # 生产数据库（凭证一律走环境变量，禁止硬编码，且不留兜底默认值）
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:}:${DB_PORT:3306}/${DB_NAME:peakflow_prod}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=${DB_USE_SSL:true}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 3000
      idle-timeout: 600000 # 10分钟空闲连接销毁
      max-lifetime: 1800000
      validation-timeout: 2000
      leak-detection-threshold: 5000

# RocketMQ 生产集群地址（环境变量注入）
rocketmq:
  name-server: ${ROCKETMQ_NAMESRV_ADDR:}
  producer:
    group: ${ROCKETMQ_PRODUCER_GROUP:peakflow-prod-producer-group}
  consumer:
    consume-thread-min: 20
    consume-thread-max: 50

# 日志：生产独立目录 ./logs/prod（轮转/保留策略见 logback-spring.xml）
logging:
  file:
    path: ${LOG_PATH:./logs/prod}
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.zhou.peakflow: ${LOG_LEVEL_APP:INFO}

# ========== 生产专属安全覆盖（覆盖 application.yml 公共配置中的安全相关项） ==========

# 1) 关闭接口文档：线上不暴露 Swagger / Knife4j
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
knife4j:
  enable: false

# 2) CORS 收紧到真实前端域名（生产必须显式配置，不允许通配）
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}

# 4) Actuator 只保留健康检查，且不暴露细节
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
