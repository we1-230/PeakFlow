upstream backend_group {
    server backend1:8080;
    server backend2:8080;
}

# ---------- HTTP 80 ----------
server {
    listen 80;
    server_name _;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # 结尾带 / 会把 /api 前缀剥掉，/api/auth/login -> /auth/login
        proxy_pass http://backend_group/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 用户上传的图片（头像 / 商品图）：文件存在后端 /app/uploads，
    # 由后端的 UploadWebConfig 映射到 /uploads/**，后端返回的是相对路径 /uploads/<uuid>.jpg。
    # 没有这条 location 时，请求会被下面的 try_files 兜底成 index.html ——
    # 浏览器拿到的是一段 HTML 而不是图片，表现就是「上传成功但页面渲染不出来」。
    # 注意 proxy_pass 结尾**不能**加 /，否则会剥掉 /uploads 前缀导致后端 404。
    location /uploads/ {
        proxy_pass http://backend_group;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public";
    }
}

# ---------- HTTPS 443 ----------
# 浏览器（Edge/Chrome）默认会把 http 自动升级成 https。
# 只监听 80 时，升级后的 https 请求无处可去，页面直接报「无法访问此网站」。
# 证书由 deploy/nginx/gen-cert.sh 生成（自签，不进版本库）。
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/peakflow.crt;
    ssl_certificate_key /etc/nginx/certs/peakflow.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend_group/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 同上：用户上传图片走后端 /uploads/**（见 80 端口的注释）
    location /uploads/ {
        proxy_pass http://backend_group;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public";
    }
}
