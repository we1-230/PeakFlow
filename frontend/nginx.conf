upstream backend_group {
    server backend1:8080;
    server backend2:8080;
}

# ---------- HTTP 80 ----------
server {
    listen 80;
    server_name _;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # 结尾带 / 会把 /api 前缀剥掉，/api/auth/login -> /auth/login
        proxy_pass http://backend_group/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ---------- HTTPS 443 ----------
# 浏览器（Edge/Chrome）默认会把 http 自动升级成 https。
# 只监听 80 时，升级后的 https 请求无处可去，页面直接报「无法访问此网站」。
# 证书由 deploy/nginx/gen-cert.sh 生成（自签，不进版本库）。
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/peakflow.crt;
    ssl_certificate_key /etc/nginx/certs/peakflow.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend_group/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
