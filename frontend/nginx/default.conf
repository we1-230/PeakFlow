# ============================================================================
# PeakFlow 秒杀商城 · 前端容器内 Nginx 配置
# ----------------------------------------------------------------------------
# 由 frontend/Dockerfile 打进镜像（COPY 到 /etc/nginx/conf.d/default.conf），
# 同时提供两件事：
#   1) 托管 Vite 构建产物（SPA + history 路由回退）
#   2) 把 /api 反向代理到后端双实例，浏览器侧无需处理跨域
#
# 与 deploy/nginx/default.conf 的区别：这里的 upstream 写的是 compose 服务名
# backend1 / backend2，靠 docker-compose 自定义网络做服务发现；
# 宿主机 Nginx 方案请用那一个。
#
# ⚠️ upstream 里的主机名必须在 nginx 启动时就能解析，否则 nginx 直接启动失败。
#    后端若不在 compose 里（例如跑在宿主机 IDE 中调试），
#    把两个 server 换成 host.docker.internal:8080 / host.docker.internal:8081。
# ============================================================================

upstream peakflow_backend {
    # least_conn：转发给「当前活跃连接数最少」的实例。
    # 秒杀下单是长耗时请求，默认轮询会把新请求继续压到正忙的实例上——
    # least_conn 能让两个实例的连接数自动拉平。
    least_conn;

    # max_fails/fail_timeout：某实例连续失败 3 次即摘除 10s，避免把流量打到死节点
    server backend1:8080 max_fails=3 fail_timeout=10s;
    server backend2:8080 max_fails=3 fail_timeout=10s;

    # 与后端保持 32 条空闲长连接，省掉每条请求重新握手的开销
    keepalive 32;
    keepalive_timeout 60s;
    keepalive_requests 1000;
}

server {
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    client_max_body_size 10m;   # 与后端 multipart 上限对齐

    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types      text/plain text/css application/json application/javascript
                    application/x-javascript text/xml application/xml
                    application/xml+rss image/svg+xml;

    # ------------------------------------------------------------------
    # 静态资源缓存：Vite 产物形如 assets/index-4f3a1c.js，内容变则文件名变，
    # 可以放心长缓存；index.html 必须不缓存，否则发版后用户拿到旧壳子
    # ------------------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # ------------------------------------------------------------------
    # /api/xxx  →  http://peakflow_backend/xxx
    # proxy_pass 结尾带 /，会把 /api 前缀剥掉；与 frontend/vite.config.js
    # 的 dev proxy 规则保持一致，前端代码统一写 /api 前缀即可
    # ------------------------------------------------------------------
    location /api/ {
        proxy_pass         http://peakflow_backend/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # 必须置空：否则 nginx 对每条请求都发 Connection: close，上面的 keepalive 形同虚设
        proxy_set_header   Connection        "";

        # 秒杀接口最坏情况要等 MQ 降级同步落库，给足超时
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # SPA history 路由回退，必须放在最后
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
